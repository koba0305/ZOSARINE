<script>

  let pendingSeat = null;

  let lastSeatForLogs = null;
  let logLoadedFrom = 0;
  let logLoadedTo   = 0;
let logTotal      = 0;

const cvs = document.querySelector('#board');
const ctx = cvs.getContext('2d');


window.addEventListener('zs:you', e => {
  mySeat = e.detail.seat || null;
  // const seatSel = document.querySelector('#seat');
  // const sitBtn  = document.querySelector('#sit');
  // seatSel.disabled = false;

window.addEventListener('zs:state', e => {
  snap = e.detail;
  document.documentElement.classList.toggle('reversed', !!snap.reverseActive);
  updateTurnPill(snap);
  render();
  rebuildLogFromSnapshot(snap);
  logLoadedTo   = Number.isFinite(snap.logEnd) ? snap.logEnd : (snap.logs?.length || 0);
  logLoadedFrom = logLoadedTo - (snap.logs?.length || 0);
  logTotal      = Number.isFinite(snap.logEnd) ? snap.logEnd : logLoadedTo;
});
window.addEventListener('zs:log',   e => appendLogLine(e.detail));
window.addEventListener('zs:logs',  e => {
  const { lines, start, total } = e.detail;
  const el = document.querySelector('#log'); if (!el) return;
  const prevHeight = el.scrollHeight;
  const frag = document.createDocumentFragment();
  (lines || []).forEach(line=>{
    const seat = detectSeatFromText(line);
    const div  = document.createElement('div');
    let cls = 'logline';
    if (seat) cls += ` log-seat-${seat}`;
    else if (String(line||'').trim().startsWith('—')) cls += ' sys';
    div.className  = cls;
    div.textContent= line;
    frag.appendChild(div);
  });
  el.insertBefore(frag, el.firstChild);
  const added = el.scrollHeight - prevHeight;
  el.scrollTop = el.scrollTop + added;
  logLoadedFrom = start;
  logTotal      = total;
});
window.addEventListener('zs:path',  e => animatePath(e.detail));

window.addEventListener('zs:error', e => {
  alert(e.detail);
  if (pendingSeat){
    disableSeatOption(pendingSeat, false);
    pendingSeat = null;
    }
});
window.addEventListener('zs:ok', (e) => {

    const t = document.getElementById('cmd');
    if (t) t.value = '';
  }
});

const TURN_COLORS = { N:'#01ffbb', E:'#1900ff', S:'#ffae00', W:'#ec1994' };

function updateTurnPill(snap){
  const el = document.getElementById('turn');
  if (!el || !snap) return;

  const seat = snap.turnSeat || null;
  const SL   = snap.seatLabels || {N:'N',E:'E',S:'S',W:'W'};

  if (!seat){
    el.textContent      = 'ナギ: -';
    el.style.background = 'transparent';
    el.style.borderColor= '#444';
    el.style.color      = '';
    return;
  }
  el.textContent      = `ナギ: ${SL[seat]}`;
  const c = TURN_COLORS[seat] || '#444';
  el.style.background = c;
  el.style.borderColor= c;
  el.style.color      = '#111';
}


function detectSeatFromText(text){
  try{
    
    const t = String(text || '').replace(/[\u0000-\u001F\u007F]/g, '');

    const SL = (snap && snap.seatLabels) || {N:'N',E:'E',S:'S',W:'W'};

    
    const esc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    for (const s of ['W','N','E','S']){
      const lab = SL[s]; if (!lab) continue;

      
      const reHead = new RegExp(`^${esc(lab)}(?:[：:]|\\s+)`);
      
      const reNagi = new RegExp(`${esc(lab)}\\s*【\\s*ナギ\\s*】`);

      if (reHead.test(t) || reNagi.test(t)){
        lastSeatForLogs = s;
        return s;
      }
    }

    
    if (/^\s*→/.test(t) && lastSeatForLogs) return lastSeatForLogs;
  }catch(_){}

  return null;
}

function isPinnedBottom(el, pad = 4){
  return el.scrollTop + el.clientHeight >= el.scrollHeight - pad;
}

function appendLogLine(text, seatCode){
  const el = document.querySelector('#log');
  if (!el) return;

  
  const stick = isPinnedBottom(el);

  const seat = seatCode || detectSeatFromText(text); 
  let cls = 'logline';
  if (seat) cls += ` log-seat-${seat}`;
  else if (String(text||'').trim().startsWith('—')) cls += ' sys';

  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  el.appendChild(div);

  if (stick) el.scrollTop = el.scrollHeight;
}


function rebuildLogFromSnapshot(s){
  const el = document.querySelector('#log'); if (!el) return;
  el.innerHTML = '';
  lastSeatForLogs = null; 
  (s?.logs || []).forEach(line => appendLogLine(line));

  el.onscroll = async ()=>{
   if (el.scrollTop <= 0) {
     await loadOlderLogs();
   }
 };
}
async function loadOlderLogs(){
  if (logLoadedFrom <= 0) return;
  window.loadLogs?.(logLoadedFrom, 120);
}



const zousanImg = new Image();
zousanImg.src = 'image/zousan.svg';
let zousanReady = false;
zousanImg.onload = ()=>{ zousanReady = true; render(); };


const zCache = new Map(); 
function colorizedZousan(color){
  if (!zousanReady) return null;
  if (zCache.has(color)) return zCache.get(color);
  const S = 256;
  const off = document.createElement('canvas');
  off.width = S; off.height = S;
  const oc = off.getContext('2d');
  oc.clearRect(0,0,S,S);
  oc.drawImage(zousanImg, 0,0, S,S);
  oc.globalCompositeOperation = 'source-atop';
  oc.fillStyle = color;
  oc.fillRect(0,0,S,S);
  oc.globalCompositeOperation = 'source-over';
  zCache.set(color, off);
  return off;
}


const onmyouImg = new Image();
onmyouImg.src = 'image/onmyou.svg';   
let onmyouReady = false;
onmyouImg.onload = ()=>{ onmyouReady = true; render(); };


const onCache = new Map(); 
function colorizedOnmyou(color){
  if (!onmyouReady) return null;
  if (onCache.has(color)) return onCache.get(color);

  const S = 256;
  const off = document.createElement('canvas');
  off.width = S; off.height = S;
  const oc = off.getContext('2d');

  oc.clearRect(0,0,S,S);
  oc.drawImage(onmyouImg, 0,0, S,S);
  oc.globalCompositeOperation = 'source-atop'; 
  oc.fillStyle = color;
  oc.fillRect(0,0,S,S);
  oc.globalCompositeOperation = 'source-over'; 

  onCache.set(color, off);
  return off;
}

(() => {
  const input = document.getElementById('cmd');
  if (!input) return;

  let composing = false; // IME状態は #cmd でだけ見る
  input.addEventListener('compositionstart', () => composing = true);
  input.addEventListener('compositionend',   () => composing = false);

  // 送信本体（ボタンと同じ経路）
  function safeSendCmd() {
    const v = (input.value || '').replace(/\u200B/g, '').trim();
    if (!v) return;
    window.sendCmd?.(v);
  }

  function isInteractive(el){
    if (!el) return false;
    if (el === input) return false;  // 自分の入力欄はOK
    const tag = el.tagName;
    return el.isContentEditable || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  }

  function handle(e){
    // IME中の Enter 系はスキップ（ブラウザ差用に 229 も見る）
    if (e.isComposing || e.keyCode === 229 || composing) return;

    const isEnter = (e.key === 'Enter' || e.code === 'Enter' || e.keyCode === 13);
    const hasMod  = (e.ctrlKey || e.metaKey);
    if (!isEnter || !hasMod) return;

    // 他の入力欄でのタイプ中は邪魔しない
    if (isInteractive(e.target)) return;

    e.preventDefault();
    e.stopPropagation();

    // フォーカスが無ければ付ける → 二段待ちで確定後に送信
    if (document.activeElement !== input) input.focus();

    setTimeout(() => setTimeout(() => {
      safeSendCmd();
    }, 0), 0);
  }

  // ドキュメント全体で拾う（キャプチャで先取り）
  document.addEventListener('keydown', handle, true);
})();

const rootStyle = document.documentElement.style;
function updatePanelInsets(){
  const header = document.querySelector('header');
  const footer = document.querySelector('footer');
  const hh = header ? header.offsetHeight : 52;
  const fh = footer ? footer.offsetHeight : 56;
  rootStyle.setProperty('--header-h', hh + 'px');
  rootStyle.setProperty('--footer-h', fh + 'px');
}
  window.addEventListener('load', updatePanelInsets);
  if (document.fonts?.ready) document.fonts.ready.then(updatePanelInsets);

updatePanelInsets();                 
window.addEventListener('resize', updatePanelInsets);


if ('ResizeObserver' in window){
  const ro = new ResizeObserver(updatePanelInsets);
  const header = document.querySelector('header');
  const footer = document.querySelector('footer');
  if (header) ro.observe(header);
  if (footer) ro.observe(footer);
}


function disableSeatOption(val, disabled){
  const seatSel = document.querySelector('#seat');
  if (!seatSel) return;
  const opt = [...seatSel.options].find(o=>o.value===val);
  if (opt) opt.disabled = !!disabled;
}


function sendCmd(){
  const t = document.querySelector('#cmd');
  if (!t) return;
  const sendText = t.value.trim();
  if (!sendText) return;
  window.sendCmd?.(sendText);
}



function updateSeatSelectNonDestructive(snap, mySeat){
  const seatSel = document.querySelector('#seat');
  if (!seatSel) return;

  const SL = snap?.seatLabels || {N:'N',E:'E',S:'S',W:'W'};
  const desired = [["","—"],["W",SL.W],["N",SL.N],["E",SL.E],["S",SL.S]];

  const prevValue = seatSel.value;
  const cur = new Map([...seatSel.options].map(o => [o.value, o]));

  for (const [val, label] of desired){
    let opt = cur.get(val);
    if (!opt){
      opt = new Option(label, val);
      seatSel.add(opt);
    } else if (opt.textContent !== label){
      opt.textContent = label;
    }
    opt.disabled = (val === "" ? false : !!snap.players?.[val]);
  }


  for (const o of [...seatSel.options]){
    if (!desired.some(([v]) => v === o.value)) seatSel.remove(o.index);
  }

  seatSel.disabled = false;

  const stillOk = [...seatSel.options].some(o => o.value === prevValue && !o.disabled);
  seatSel.value = stillOk ? prevValue : "";
if (!seatSel.value && mySeat && ![...seatSel.options].find(o=>o.value===mySeat)?.disabled){
    seatSel.value = mySeat;
  }
}

const SEAT_COLORS = { N:'#01ffbb', E:'#1900ff', S:'#ffae00', W:'#ec1994' };
function seatColor(seat){ return SEAT_COLORS[seat] || '#aaa'; }

  function render(){

    if (!snap) return;
 const SL = snap.seatLabels || {N:'N',E:'E',S:'S',W:'W'};
  updateSeatSelectNonDestructive(snap, mySeat);
    updateTurnPill(snap);

   
    const ph = document.querySelector('#phase'); if (ph) ph.textContent = snap.phase;

const turnEl = document.querySelector('#turn');


const rows = ['<tr><th>オマ</th><th>ゾーサリーヌ</th><th>ゾーサン</th></tr>'];
for (const seat of ['W','N','E','S']){
  const p = snap.players?.[seat];
  rows.push(`<tr><td>${SL[seat]}</td><td>${p? p.name: '-'}</td><td>${p? p.score: 0}</td></tr>`);
}
document.querySelector('#players').innerHTML = rows.join('');




    // board
    const W = cvs.width, H = cvs.height; ctx.clearRect(0,0,W,H);
    const PAD = Math.round(Math.min(W,H) * 0.08);
const innerW = W - PAD*2, innerH = H - PAD*2;
const cell = innerW / 5;


ctx.strokeStyle = '#333';
for (let i=0;i<=5;i++){
  ctx.beginPath(); ctx.moveTo(PAD, PAD + i*cell); ctx.lineTo(PAD + innerW, PAD + i*cell); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD + i*cell, PAD); ctx.lineTo(PAD + i*cell, PAD + innerH); ctx.stroke();
}

const COLS = (snap.labels?.cols ?? ['A','B','C','D','E']).slice(0,5);
const ROWS = (snap.labels?.rows ?? ['1','2','3','4','5']).slice(0,5);

ctx.save();
ctx.fillStyle = '#bbb';
ctx.font = '18px ui-monospace';


ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
COLS.forEach((ch,i)=> ctx.fillText(ch, PAD + i*cell + cell/2, PAD - 6));


ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
ROWS.forEach((ch,i)=> ctx.fillText(ch, PAD - 6, PAD + i*cell + cell/2));
ctx.restore();


const gx = x => PAD + x*cell;
const gy = y => PAD + y*cell;
    
    // arrows
if (snap.arrows){
  for (const [seat,xy] of Object.entries(snap.arrows)){
     if (!xy) continue;
     drawArrowMarker(xy.x, xy.y, seat);
   }
 }




    // pieces
    for (let y=0;y<5;y++) for (let x=0;x<5;x++){
      const c = snap.board[y][x]; if (!c) continue;
      drawPiece(x,y,c.dir, seatColor(c.owner));
    }


const drawEdgeBand = (seat, alpha)=> {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = seatColor(seat);
  if (seat==='N') ctx.fillRect(PAD, PAD - cell*0.12, innerW, cell*0.12);
  if (seat==='S') ctx.fillRect(PAD, PAD + innerH,  innerW, cell*0.12);
  if (seat==='W') ctx.fillRect(PAD - cell*0.12, PAD, cell*0.12, innerH);
  if (seat==='E') ctx.fillRect(PAD + innerW,  PAD, cell*0.12, innerH);
  ctx.restore();
};

['W','N','E','S'].forEach(s=>{
  if (snap.players?.[s]) drawEdgeBand(s, 0.10);
});

if (mySeat) drawEdgeBand(mySeat, 0.20);


function drawName(seat, x, y, rot=0){
  const p = snap.players?.[seat]; if (!p) return;
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot);
  ctx.fillStyle = (seat===mySeat)? '#fff' : 'rgba(187,187,187,0.6';
  ctx.font = (seat===mySeat? 'bold ' : '') + '18px ui-monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(p.name, 0, 0);
  ctx.restore();
}
drawName('N', PAD + innerW/2,     PAD - 24,          0);
drawName('S', PAD + innerW/2,     PAD + innerH + 24, 0);
drawName('W', PAD - 24,           PAD + innerH/2,   -Math.PI/2);
drawName('E', PAD + innerW + 24,  PAD + innerH/2,    Math.PI/2);


function drawPiece(x, y, dir, color){
  const cx = gx(x) + cell/2,  cy = gy(y) + cell/2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angleForDir(dir));

  const sz = cell * 0.86; 

  if (onmyouReady){
    const img = colorizedOnmyou(color);
    if (img){
      
      if (snap?.reverseActive){
        ctx.save();
        ctx.globalAlpha = 0.65;
        ctx.drawImage(colorizedOnmyou('#ffffff'), -sz/2, -sz/2, sz, sz); 
        ctx.restore();
      }
      ctx.drawImage(img, -sz/2, -sz/2, sz, sz);
      ctx.restore();
      return;
    }
  }

  
  const r = cell * 0.38;
  const pts = regularPolygonPoints(5, r, -Math.PI/2);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = Math.max(2, cell*0.06);
  ctx.strokeStyle = (snap?.reverseActive ? '#fff' : '#000');
  ctx.stroke();

  ctx.restore();
}


function drawArrowMarker(x, y, seat){
  const color = seatColor(seat);
  const dir   = seatInwardDir(seat);
  const ang   = angleForDir(dir);
  const cx = gx(x) + cell/2,  cy = gy(y) + cell/2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  if (zousanReady){
    const img = colorizedZousan(color);
    const sz = cell * 0.9; 
    ctx.globalAlpha = 0.5;   
    ctx.drawImage(img, -sz/2, -sz/2, sz, sz);
    ctx.globalAlpha = 1.0;
  } else {
    
    const r = cell * 0.38;
    const pts = regularPolygonPoints(5, r, -Math.PI/2);
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = Math.max(2, cell*0.06); ctx.strokeStyle = '#000'; ctx.stroke();
  }
  ctx.restore();
}

function angleForDir(dir){
  if (dir==='up')    return 0;
  if (dir==='right') return Math.PI/2;
  if (dir==='down')  return Math.PI;
  if (dir==='left')  return -Math.PI/2;
  return 0;
}

function regularPolygonPoints(n, r, start){
  const out = [];
  for (let i=0;i<n;i++){
    const a = start + i * 2*Math.PI/n;
    out.push({x: Math.cos(a)*r, y: Math.sin(a)*r});
  }
  return out;
}


function seatInwardDir(seat){
  return seat==='N' ? 'down' :
         seat==='S' ? 'up'   :
         seat==='E' ? 'left' :
         seat==='W' ? 'right' : 'up';
}
  
    function triangle(x1,y1,x2,y2,x3,y3){ ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath(); }
  }


  function cellSizeAndPad(){
  const W = cvs.width, H = cvs.height;
  const PAD = Math.round(Math.min(W, H) * 0.08);
  const innerW = W - PAD*2, innerH = H - PAD*2;
  const cell = innerW / 5;
  return { W, H, PAD, innerW, innerH, cell };
}
function cellCenter(x, y){
  const { PAD, cell } = cellSizeAndPad();
  return { cx: PAD + x*cell + cell/2, cy: PAD + y*cell + cell/2 };
}
function drawPathBeam(points, color){
  if (points.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  // 外側グロー
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 14;
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke();

  // 芯線（座席色）
  ctx.shadowBlur = 0;
  ctx.strokeStyle = color || 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke();
  ctx.restore();
}

async function animatePath({ seat, path, exit, scoreDelta }){
  const { PAD, cell } = cellSizeAndPad();
  const coreColor = seatColor(seat); // 芯の線色

  // ポリライン用の点列：矢印マス中心 → 各マス中心
  const points = [];
  const startXY = snap?.arrows?.[seat];
  if (startXY){
    const { cx, cy } = cellCenter(startXY.x, startXY.y);
    points.push({ x: cx, y: cy });
  }
  for (const p of path){
    const { cx, cy } = cellCenter(p.x, p.y);
    points.push({ x: cx, y: cy });
  }

  for (let i = 0; i < path.length; i++){
    render(); // 盤・駒・矢印をまず描く

    // ここまで踏破したセル矩形を淡く
    for (let k = 0; k <= i; k++){
      const { x, y } = path[k];
      ctx.fillStyle = 'rgba(255,255,255,0.20)';
      ctx.fillRect(PAD + x*cell + 1, PAD + y*cell + 1, cell - 2, cell - 2);
    }
    drawPathBeam(points.slice(0, Math.min(points.length, i + 2)), coreColor);
    await wait(120);
  }
  // 最後にフルの経路を少しだけ表示してからクリア
  render();
  // 全セル淡く
  for (let i=0;i<path.length;i++){
    const { x, y } = path[i];
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.fillRect(PAD + x*cell + 1, PAD + y*cell + 1, cell - 2, cell - 2);
  }
  drawPathBeam(points, coreColor);
  await wait(400);
  render();
}
  function wait(ms){ return new Promise(r=>setTimeout(r,ms)); 


  }
